name: Build Sample PDFs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sample-pdfs:
    name: Build ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template:
          - template_1
          - template_2
          - maang_1
          - fanng_1
          - europass_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra
          pdflatex --version

      - name: Build sample PDF
        shell: pwsh
        run: ./scripts/build-user-resume.ps1 -Source linkedin -Template '${{ matrix.template }}'

      - name: Upload sample PDF
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.template }}
          path: build/*.pdf
          if-no-files-found: error
          retention-days: 7
